name: Release

# Runs when a GitHub release is published. Release tags are date based:
# YYYY.MM.DD.N, for example 2026.11.11.1 (N counts releases on that day).
# The release job attaches the firmware, the emulator site and the static
# Linux binaries for the Raspberry Pi to the release, with SHA256SUMS.txt,
# and publishes the emulator to GitHub Pages. The image job (image.yml)
# builds the flashable Raspberry Pi images and attaches them on its own, so
# a slow or failing image build never holds back the firmware.

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: Linux program for Raspberry Pi (${{ matrix.arch }}, static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: armhf
            platform: linux/arm/v6 # ARMv6 hard float: runs on every Pi, the original Zero W included
          - arch: arm64
            platform: linux/arm64
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build in Alpine
        run: docker run --rm --platform ${{ matrix.platform }} -e NP_VERSION="$TAG" -v "$PWD:/src" alpine:3.23 /src/targets/linux/build-static.sh /src/out/${{ matrix.arch }}
      - name: Check the architecture and the version
        run: |
          file out/${{ matrix.arch }}/newspaper
          if [ "${{ matrix.arch }}" = armhf ]; then
            readelf -A out/armhf/newspaper | grep -q 'Tag_CPU_arch: v6'
          else
            file out/arm64/newspaper | grep -q 'ARM aarch64'
          fi
          got="$(docker run --rm --platform ${{ matrix.platform }} -v "$PWD/out:/out" alpine:3.23 /out/${{ matrix.arch }}/newspaper --version)"
          [ "$got" = "$TAG" ] || { echo "binary reports version '$got', expected '$TAG'" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/${{ matrix.arch }}

  image:
    name: Raspberry Pi images
    permissions:
      contents: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      board: all

  release:
    needs: linux
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag format
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Release tag '$TAG' is not of the form YYYY.MM.DD.N" >&2
            exit 1
          fi
          # The tag becomes the firmware version reported to the platform.
          echo "$TAG" > VERSION

      - name: Host tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Build the firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: targets/esp32
          command: idf.py build && idf.py merge-bin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build the emulator
        run: ./targets/wasm/build.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: linux-binaries

      - name: Collect release files
        run: |
          set -euo pipefail
          out=release-files
          parts="newspaper-display-$TAG-esp32s3-parts"
          mkdir -p "$out" "$parts"
          b=targets/esp32/build
          cp "$b/merged-binary.bin" "$out/newspaper-display-$TAG-esp32s3-merged.bin"
          cp "$b/bootloader/bootloader.bin" "$parts/bootloader.bin"
          cp "$b/partition_table/partition-table.bin" "$parts/partition-table.bin"
          cp "$b/newspaper-display.bin" "$parts/newspaper-display.bin"
          cp "$b/flash_args" "$parts/flash_args"
          cp docs/FLASHING.md "$parts/FLASHING.md"
          cp docs/FLASHING.md "$out/FLASHING.md"
          zip -r "$out/$parts.zip" "$parts"
          (cd targets/wasm/dist && zip -r "../../../$out/newspaper-emulator-$TAG.zip" .)
          for arch in armhf arm64; do
            install -m 0755 "linux-binaries/linux-$arch/newspaper" "$out/newspaper-display-$TAG-linux-$arch"
          done
          (cd "$out" && sha256sum * > SHA256SUMS.txt)
          ls -l "$out"

      - name: Attach the files to the release
        run: gh release upload "$TAG" release-files/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: targets/wasm/dist
      - name: Publish the emulator to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
