# The Morning Newspaper display: settings for the Linux program.
# Installed as /etc/newspaper/newspaper.conf. Every setting also works as a
# command line option: pin_busy = 17 is --pin-busy 17. Lines starting with #
# are comments; the values shown are the defaults.

# Platform address.
#api = https://newspaper.brushknight.com

# Where the device token and the panel's state are kept (mode 0700, the file inside 0600).
data_dir = /var/lib/newspaper
# Timers that must survive a restart of the program but not a reboot.
runtime_dir = /run/newspaper

# A stable label sent when pairing. Empty: "rpi-" and the board serial number.
#hardware_id =
# CA bundle for HTTPS. Empty: the system default.
#ca_file =
#verbose = no

# ---- Panel: Pimoroni Inky Impression 13.3" (EL133UF1) on the 40 pin header ----
# BCM GPIO numbers, from Pimoroni's inky/inky_el133uf1.py (see docs/HARDWARE.md).
#spi_device = /dev/spidev0.0
#spi_hz = 10000000
# Empty: the chip behind the header (pinctrl-bcm2835, -bcm2711, -bcm2712 or -rp1).
#gpiochip =
#pin_cs0 = 26
#pin_cs1 = 16
#pin_dc = 22
#pin_reset = 27
#pin_busy = 17

# ---- Buttons A, B, C on the Inky Impression 13.3" (D, GPIO 24, is not used) ----
# From Pimoroni's examples/spectra6/buttons.py. -1 turns a button off.
#button_next = 5
#button_back = 6
#button_home = 25
#debounce_ms = 30

# ---- Network: Raspberry Pi OS owns Wi-Fi ----
# Wait for a default route and a set clock before each attempt.
#network_check = yes
#network_wait_s = 30
# Advice on the panel's "No Wi-Fi connection" screen (at most about 45 characters each).
#wifi_help1 = Set up Wi-Fi with Raspberry Pi Imager when
#wifi_help2 = you write the card, or on the Pi itself
#wifi_help3 = with: sudo nmtui

# ---- No-hardware mode: frames go to PNG and raw files, for testing on any computer ----
#no_hardware = no
# Empty: <data_dir>/frames
#frames_dir =
#sim_refresh_ms = 3000
# Only no-hardware mode may lower the panel's 180 s rest.
#sim_rest_ms = 180000
