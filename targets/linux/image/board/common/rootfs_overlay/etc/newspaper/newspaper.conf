# The Morning Newspaper display, flashable image. All settings are listed in
# targets/linux/newspaper.conf of https://github.com/brushknight/newspaper
data_dir = /data/newspaper
runtime_dir = /run/newspaper
ca_file = /etc/ssl/certs/ca-certificates.crt
wifi_help1 = Put the SD card in a computer and edit
wifi_help2 = newspaper-wifi.txt on its NEWSPAPER drive,
wifi_help3 = then put it back and restart the display.
